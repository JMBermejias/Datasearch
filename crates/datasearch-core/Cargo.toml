[package]
name = "datasearch-core"
description = "Nucleo de logica de DataSearch - Jose Manuel Bernabeu Mejias"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Base de datos de la aplicacion (SQLite embebido)
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# Bases de datos remotas SQL
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
] }
tiberius = { version = "0.12", default-features = false, features = [
    "tds73",
    "chrono",
    "tokio",
    "tokio-util",
] }

# No relacional
mongodb = "3"
futures-util = "0.3"
chrono = "0.4"
tokio-util = { version = "0.7", features = ["compat"] }
bson = { version = "2", features = ["chrono-0_4"] }

# Ficheros y web
csv = "1"
quick-xml = "0.37"
calamine = "0.26"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "charset",
    "http2",
] }

# Exportacion
rust_xlsxwriter = "0.87"
pdf-writer = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
base64 = "0.22"

# Utilidades
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
url = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
