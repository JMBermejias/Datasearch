[workspace]
members = ["crates/datasearch-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["Jose Manuel Bernabeu Mejias"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
