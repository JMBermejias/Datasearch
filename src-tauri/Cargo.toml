[package]
name = "datasearch-tauri"
description = "DataSearch - Aplicacion de extraccion y analisis de datos"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "datasearch"

# El nombre del binario es el que Tauri usa para el icono del escritorio
# (datasearch.png) y para la linea Exec del fichero .desktop. Con el nombre
# "datasearch-tauri" el icono instalado no coincidia con el que declara el
# escritorio, y Zorin OS mostraba el icono generico.
[[bin]]
name = "datasearch"
path = "src/main.rs"

[lib]
name = "datasearch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datasearch-core = { path = "../crates/datasearch-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
